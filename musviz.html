  function defaults(){

  function opencv_ready(){

  function cropped_image(img, starty, height, startx = 0, width = img.width){
    let canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    let ctx = canvas.getContext('2d');
    ctx.drawImage(img, startx, starty, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
    //let res = document.createElement('img');
    //canvas_img(canvas, res);
    return canvas;
  }

  function split_rect(slices){
    let results = [];
    let img_div = document.getElementById('pdf_images');
    let last = -1;
    slices.forEach(function(s, i){
      let time = 9999;
      if(s.p != last){
        last = s.p;
        time = window.canvi[s.p].time;
      }
      let c = cropped_image(window.canvi[s.p].i, s.y, s.height, s.x, s.width);
      results.push({c: c, i: c.cloneNode(), m: c.cloneNode(), splits: [{endy: c.height, visible: true}], time: time});
    })
    img_div.innerHTML = '';
    window.canvi = results;
    window.canvi.forEach(function(c, i){
      let ctx = c.i.getContext('2d');
      ctx.drawImage(c.c, 0, 0);
      $(c.c).attr('id', 'c'+i);
      $(c.c).hide();
      img_div.appendChild(c.c);
    })
    $('#c0').show();
  }

  function split_pages(){
    let results = [];
    window.canvi.forEach(function(c){
      let starty = 0;
      for(let i = 0; i < c.splits.length; i++){
        let height = c.splits[i].endy - starty;
        if(c.splits[i].visible) results.push(cropped_image(c.i, starty, height));
        starty = c.splits[i].endy+1;
      }
    })
    window.canvi = [];
    let img_div = document.getElementById('pdf_images');
    img_div.innerHTML = '';
    results.forEach((canvas, index) =>{
      let time = 9999;
      if(index == 0) time = 0;
      window.canvi.push({c: canvas, i: canvas.cloneNode(), m: canvas.cloneNode(), splits: [{endy: canvas.height, visible: true}], time: time});
      let ctx = window.canvi[index].i.getContext('2d');
      ctx.drawImage(canvas, 0, 0);
      $(canvas).attr('id', 'c'+index);
      $(canvas).hide();
      img_div.appendChild(canvas);
    })
    window.current_page = 0;
    $('#c'+window.current_page).show();
  }

  function load_source(evt){
    let f = this.files[0];
    if(f.type.match('application/pdf')){
      load_pdf(URL.createObjectURL(f));
    }else if(f.type.match('audio.*')){
      load_audio(URL.createObjectURL(f));
    }
  }

  function load_audio(url){
    let source = document.createElement('source');
    source.src = url;
    let audio = document.getElementById('audio');
    audio.innerHTML = '';
    audio.appendChild(source);
    playable_events(audio);
  }

  function playable_events(element){
    $(element).on('play', start_syncing);
    $(element).on('pause', stop_syncing);
    $(element).on('seeking', sync);
    $(element).on('seeked', sync);
  }
  
  function start_syncing(){
    //console.log('stn')
    window.origin_time = performance.now();
    window.current_playing = document.getElementById('audio');
    window.raf_callback = window.requestAnimationFrame(timeupdate);
  }

  function stop_syncing(){
    if(window.raf_callback) window.cancelAnimationFrame(window.raf_callback);
    window.raf_callback = null;
    window.current_playing = null;
  }

  function timeupdate(){
    if(window.current_time != window.current_playing.currentTime){
      sync();
    }
    if(window.current_playing){
      //if(window.current_time > 3) window.current_playing.playbackRate = 0.5;
      window.raf_callback = window.requestAnimationFrame(timeupdate);
    }else{
      window.raf_callback = null;
    }
    
  }

  function sync(){
    if(window.current_playing) window.current_time = window.current_playing.currentTime;
    let page = 0;
    let max_time = 0;
    /*if (window.current_playing){
      let real_time = (performance.now() - window.origin_time)/1000;
      let pr = t_b.speedAt(real_time);
      let pr_num = pr.n / pr.d;
      //console.log(Math.floor(real_time),pr_num);
      window.current_playing.playbackRate = pr_num;
    }*/
    for(let i = 0; i < canvi.length; i++){ // TODO turn this around so you're searching on hit-points!
      if(canvi[i].time < window.current_time && canvi[i].time > max_time){
        max_time = canvi[i].time;
        page = i;
      }
    }
    goto_page(page);
    if(!window.current_playing) return;
      //console.log(window.current_page, window.current_playing.duration);
    if(window.current_page < canvi.length - 1 && canvi[window.current_page + 1].time < window.current_playing.duration+1){
        // show proportional amount across page
        let end_t = canvi[window.current_page + 1].time;
        let page_dur = end_t - canvi[window.current_page].time;
        let time_offset = window.current_playing.currentTime - canvi[window.current_page].time;
        let x = time_offset / page_dur * canvi[window.current_page].c.width;
        composite_image(window.current_page, {type: 'vert', x});
    }
      
    } 
    //.map(function(e,i){return [e.time,i]}).sort(function(a,b){return a[0]-b[0]})

  function add_point(){
    if(window.current_page >= canvi.length) return;
    console.log(window.current_page);
    canvi[window.current_page + 1].time = window.current_playing.currentTime;
    next_page();
  }

  function canvas_mm(evt, id = false){
    //console.log(evt.offsetY);
    if(window.current_playing) return;
    if(!id) id = $(this).attr('id').substring(1);
    //console.log(evt.offsetX, evt.offsetY);
    let marker = window.canvi[id].m;
    let canvas = window.canvi[id].c;
    let y = evt.offsetY;
    let m = {type: 'horiz', y}
    composite_image(id, m);
  }

  function redraw_splits(id){
    let m = window.canvi[id].m;
    let splits = window.canvi[id].splits;
    let ctx = m.getContext('2d');
    ctx.clearRect(0, 0, window.canvi[id].c.width, window.canvi[id].c.height);
    ctx.strokeStyle = 'blue';
    ctx.linewidth = '1';
    //console.log(splits)
    splits.forEach((s,i) =>{
      let last_y = 0;
      if(i > 0) last_y = splits[i - 1].endy;
      ctx.beginPath();
      ctx.moveTo(0, s.endy);
      ctx.lineTo(canvi[id].m.width, s.endy);
      ctx.stroke();
      if(!s.visible){
        ctx.globalAlpha = 0.2;
        ctx.fillstyle = 'lightgrey';
        //console.log(last_y, window.canvi[id].c.width, s.endy);
        console.log(last_y);
        ctx.fillRect(0, last_y, window.canvi[id].c.width, s.endy - last_y);
        ctx.globalAlpha = 1;
      }
    });

  }

  function composite_image(id, marker = false){
    //draw_splits(id);
    let ctx = canvi[id].c.getContext('2d');
    ctx.clearRect(0, 0, canvi[id].c.width, canvi[id].c.height);
    ctx.drawImage(canvi[id].i, 0, 0);
    ctx.drawImage(canvi[id].m, 0, 0);
    if(marker){
      ctx.beginPath();
      ctx.strokeStyle = 'red';
      ctx.setLineDash([1,1]);
      ctx.linewidth = '1';
      if(marker.type == 'horiz'){
        ctx.moveTo(0, marker.y);
        ctx.lineTo(canvi[id].c.width, marker.y);
      }else if(marker.type == 'vert'){
        ctx.moveTo(marker.x, 0);
        ctx.lineTo(marker.x, canvi[id].c.height);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function canvas_ml(evt){
    let id = $(this).attr('id').substring(1);
    composite_image(id);
  }

  function canvas_split(evt){
    if(window.current_playing){
      add_point();
      return;
    }
    let id = $(this).attr('id').substring(1);
    let point = evt.offsetY;
    if(evt.shiftKey){
      // toggle visibility
      for(let i = 0; i < canvi[id].splits.length; i++){
        if(canvi[id].splits[i].endy > point){ // reached it
          //console.log(i, point);
          canvi[id].splits[i].visible = !canvi[id].splits[i].visible;
          break;
        }
      }
    }else{
      canvi[id].splits.push({endy: point, visible: true});
      canvi[id].splits.sort((a,b)=>{return a.endy - b.endy});
    }
    redraw_splits(id);
    canvas_mm(evt, id);
  }

  function next_page(){
    
    $('#c'+window.current_page).hide();
    if(window.current_page < canvi.length) window.current_page++;
    $('#c'+window.current_page).show();
  }

  function prev_page(){
    $('#c'+window.current_page).hide();
    if(window.current_page > 0) window.current_page--;
    $('#c'+window.current_page).show();
  }

  function goto_page(p){
    if(p == window.current_page || p < 0 || p > canvi.length) return;
    $('#c'+window.current_page).hide();
    window.current_page = p;
    $('#c'+window.current_page).show();
  }

  async function load_pdf(url){
    let pdf = await pdfjsLib.getDocument(url).promise;
    $('#pages').text(pdf.numPages);
    window.current_page = 0;
    for(let i = 1; i <= pdf.numPages; i++){
      let page = await pdf.getPage(i);
      let viewport = page.getViewport({scale: 1});
      let canvas = document.createElement('canvas');
      let index = i - 1;
      //console.log(canvas, window.canvi[0].i);
      let context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      let canvi = [];

      let renderContext = {
        canvasContext: context,
        viewport: viewport
      };
      try {
        await page.render(renderContext).promise;
        let time = 999999;
        if(i == 1) time = 0;
        window.canvi.push({c: canvas, i: canvas.cloneNode(), m: canvas.cloneNode(), splits: [{endy: canvas.height, visible: true}], time: time});
        let ctx = window.canvi[index].i.getContext('2d');
        ctx.drawImage(canvas, 0, 0);
        $(canvas).attr('id', 'c'+index);
        $(canvas).hide();
        //let img = document.createElement('img');
        //canvas_img(canvas, img);
        //console.log(img);
        document.getElementById('pdf_images').appendChild(canvas);
      } catch (e){
        console.log('Error rendering page '+i+':',e);
      }
    }
    $('#c'+window.current_page).show();
  }

  function canvas_img(canvas, img){
    canvas.toBlob(function(blob){
      let url = URL.createObjectURL(blob);
      img.onload = function(){
        URL.revokeObjectURL(url);
      }
      img.src = url;
    })
  }

function draw_polygon(ctx, a){
  console.log(a);
  if(!a[0].length){
    ctx.beginPath();
    ctx.moveTo(a[0].x, a[0].y);
    a.forEach(polygon =>{
      //console.log(polygon);
      ctx.lineTo(polygon.x, polygon.y);
    })
    ctx.closePath();
    ctx.stroke();
  }else{
    // recurse
    a.forEach(p => draw_polygon(ctx, p));
  }
}

function batch_process(){
  let len = window.canvi.length;
  let rects = [];
    for(let index = 0; index < len; index++){
      rects.push(ocv_process(index, 'hull'));
    }
    //return;
  //console.log(rects);
  rects.forEach(r => {
    //console.log(r);
    let ctx = canvi[r.page].i.getContext('2d');
    ctx.strokeStyle = "#FF0000";
    r.areas.forEach(a => draw_polygon(ctx, a));
  })
  //split_rect(rects);
}

function ocv_process(page, method = 'hull'){
  let src = cv.imread(window.canvi[page].c);
  let dst = cv.Mat.zeros(src.rows, src.cols, cv.CV_8UC3);
  cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY, 0);
  cv.threshold(dst, dst, 0, 255, cv.THRESH_BINARY_INV+cv.THRESH_OTSU);
  //cv.imshow(window.canvi[page].i, dst)
  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();
  let polygons = [];
  let images = [];
  // You can try more different parameters
  cv.findContours(dst, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
  // draw contours with random Scalar
  let main_rects = [];
  let small_rects = [];
  let prev_cols = [];
  for (let i = 0; i < contours.size(); ++i) {
    //if(cv.contourArea(contours.get(i)) < 5) continue;
    let rect = cv.boundingRect(contours.get(i));
    rect.contour = contours.get(i);


    let M = cv.moments(contours.get(i));
    if(M.m00 == 0){
      continue; // Too small to be meaningful
    }else{
      rect.cx = M.m10 / M.m00;
      rect.cy = M.m01 / M.m00;
    }

    if(method == 'hull'){
      rect.hull = Array.from(rect.contour.data32S);
    }else if(method == 'contours'){
      rect.all_contours = [ Array.from(rect.contour.data32S) ];
    }
    

    if(rect.width/src.cols > 0.1 && rect.height/src.rows > 0.05){ // probably a main element
      let belongingCol = new cv.Scalar(Math.round(Math.random() * 255), Math.round(Math.random() * 255),
                              Math.round(Math.random() * 255));
      //intensity += 20;
      rect.col = belongingCol;
      rect.p = page;
      main_rects.push(rect);
    }else{
      small_rects.push(rect);
    }
}

small_rects.forEach(function(rect){
  // Find the nearest big rectangle to attach to
  //if(rect.width < 2 && rect.height < 2) return;
  if(!rect.cx){
    console.log('none');
    return; // ignore ones without moments
  }
  let distance = src.cols * src.rows; // So definitely we'll find something smaller!
  let closest = -1;
  let point = new cv.Point(rect.cx, rect.cy);
  rect.distances = [];
  main_rects.forEach(function(mr, i){
    let d = cv.pointPolygonTest(mr.contour, point, true);

    d = -d; // Because we want it negative for inside!
    rect.distances.push(d);
    if(d < distance){
      distance = Math.floor(d);
      closest = i;
    }
  });

  if(closest == -1){
    console.log('impossible',rect);
    return;
  }

  if(method == 'hull'){
    main_rects[closest].hull.push(...rect.hull);
  }else if(method == 'contours'){
    main_rects[closest].all_contours.push(rect.all_contours[0]);
  }else if(method == 'rect'){
    if(rect.x < main_rects[closest].x){
      let diffox = main_rects[closest].x - rect.x;
      main_rects[closest].x = rect.x;
      main_rects[closest].width += diffox;
      
    }
    if(rect.y < main_rects[closest].y){
      //console.log(rect.y, main_rects[closest].y)
      let diffoy = main_rects[closest].y - rect.y;
      
      main_rects[closest].y = rect.y;
      main_rects[closest].height += diffoy;
    }
    
    if(rect.x+rect.width > main_rects[closest].x+main_rects[closest].width){
      let diffx = (rect.x+rect.width) - (main_rects[closest].x+main_rects[closest].width);
      //console.log('diff', diff);
      main_rects[closest].width += diffx;
    }
    if(rect.y+rect.height > main_rects[closest].y+main_rects[closest].height){
      let diffy = (rect.y+rect.height) - (main_rects[closest].y + main_rects[closest].height);
      main_rects[closest].height += diffy;
    }
  }
  // Now add extend this main_rectangle to encompass it
  
  //console.log(main_rects[closest]);
  rect.contour.delete();
});

main_rects.sort((a,b) => a.y - b.y)
//src.delete(); dst.delete(); contours.delete(); hierarchy.delete();
//return main_rects;

main_rects.forEach((rect,i) => {
  if(method == 'hull'){
    //var hull = new cv.MatVector();
    //console.log(rect.hull);
    //console.log(rect.contour.data32S, rect.hull.data32S);
    let tmp = cv.matFromArray(rect.hull.length / 2, 1, cv.CV_32SC2, rect.hull);
    let hull = new cv.Mat();
    cv.convexHull(tmp, hull, false, true);
    //console.log(tmp2.data32S);
    //cv.approxPolyDP(tmp1, tmp2, 3, true)
    //hull.push_back(tmp2);
    //cv.drawContours(dst, hull, 0, rect.col, 1, 8);
    let pg = [];
    for(let i = 0; i < hull.data32S.length / 2; i++){
      pg.push({x: hull.data32S[i*2], y: hull.data32S[i*2+1]});
    }
    tmp.delete();
    hull.delete();
    polygons.push(pg);
  }else if(method == 'rect'){
    polygons.push([
      {x: rect.x, y: rect.y},
      {x: rect.x+rect.width, y: rect.y},
      {x: rect.x+rect.width, y: rect.y+rect.height},
      {x: rect.x, y: rect.y+rect.height}
    ]);
  }else if(method == 'contours'){
    let pg = [];
    rect.all_contours.forEach(c =>{
      let cont = [];
      for(let i = 0; i < c.length / 2; i++){
        cont.push({x: c[i*2], y: c[i*2+1]});
      }
      pg.push(cont);
    })
    polygons.push(pg);
    
    let img = cv.Mat.ones(src.rows, src.cols, src.type());
    rect.all_contours.forEach(c =>{
      let mask = new cv.Mat.zeros(src.rows, src.cols, cv.CV_8U);
      //console.log(c);
      let contvec = new cv.MatVector();
      let contour = cv.matFromArray(c.length / 2, 1, cv.CV_32SC2, c);
      let col = new cv.Scalar(255);
      contvec.push_back(contour);
      cv.drawContours(mask, contvec, -1, col, cv.FILLED);
      //console.log(contour.data32S, mask.data32S)
      src.copyTo(img, mask);
      //console.log(img.data32S);
      //mask.delete();
      contour.delete();
      contvec.delete();
    })
    let full = rect.all_contours.flat();
    let full_cv = new cv.matFromArray(full.length / 2, 1, cv.CV_32SC2, full);
    let roi = new cv.Mat();
    roi = img.roi(cv.boundingRect(full_cv));
    let canvas = document.createElement('canvas');
    cv.imshow(canvas, roi);
    img.delete();
    roi.delete();
    full_cv.delete();
    images.push(canvas);
  }
  rect.contour.delete();
})
//dst.convertTo(dst, cv.CV_8U, scale, shift);
//cv.imshow(window.canvi[page].i, dst);
src.delete(); dst.delete(); contours.delete(); hierarchy.delete();
return {page: page, areas: polygons, images: images};
  }

function average(array, element){
    return (array.reduce((a,b)=> {return a + b[element]}, 0) / array.length) || 0;
}

function avg_all(array){
    // Presumes all elements have same basic structure
    if(array.length == 0) return undefined;
    let avg = {};
    for(k of Object.keys(array[0])){
      avg[k] = average(array, k);
    }
    return avg;
  }

function barlines(){
let src = cv.imread(window.canvi[window.current_page].c);
let dst = cv.Mat.zeros(src.rows, src.cols, cv.CV_8UC3);
let lines = new cv.Mat();
let color = new cv.Scalar(255, 0, 0);
cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY, 0);
cv.Canny(dst, dst, 50, 200, 3);
// You can try more different parameters
cv.HoughLinesP(dst, lines, 1, Math.PI, 2, src.rows / 2, 5);
// draw lines
let segments = [];

for (let i = 0; i < lines.rows; ++i){
    segments.push({x1: lines.data32S[i * 4], y1: lines.data32S[i * 4 + 1], x2: lines.data32S[i * 4 + 2], y2: lines.data32S[i * 4 + 3]});
}
lines.delete();
segments.sort((a,b) => a.x1 - b.x1);
let filtered_segs = [];
let averaging_segs = [];
let first_x = 0;
if(segments.length > 0) first_x = segments[0].x1;;
for (let s of segments){
    if(s.x1 - first_x < src.cols / 100){
        averaging_segs.push(s);
        first_x = s.x1;
    }else if(averaging_segs.length > 0){
        let avg = avg_all(averaging_segs);
        filtered_segs.push(avg);
        averaging_segs = [];
        first_x = s.x1;
    }else{
      // Solitary line
      filtered_segs.push(s);
    }
}
if(averaging_segs.length > 0){
  // Clear up last ones
  let avg = avg_all(averaging_segs);
  filtered_segs.push(avg);
}
for (let s of filtered_segs) {
    let startPoint = new cv.Point(s.x1, s.y1);
    let endPoint = new cv.Point(s.x2, s.y2);
    cv.line(dst, startPoint, endPoint, color);
}
cv.imshow(window.canvi[window.current_page].c, dst);
src.delete(); dst.delete();
}



  function edges(){
